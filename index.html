<script>
"use strict";
// ================================================================== instellingen
const CLIENT_ID = "6586dbdb-2426-484e-b3b3-8304c079b511";        // Azure app-registratie (Application (client) ID), zie handleiding
const PAD = "AI Projects/Energie Claude/4_Uitvoer/mobiel_v2.json";   // t.o.v. de hoofdmap van OneDrive
const OUD_MIN = 45;                                    // data ouder dan dit -> gele balk
const VERVERS_MIN = 5;                                 // opnieuw ophalen zolang de pagina open is
const AUTH = "https://login.microsoftonline.com/consumers/oauth2/v2.0";
const SCOPE = "Files.Read offline_access";
const REDIRECT = location.origin + location.pathname;

// ================================================================== hulpjes
const q = s => document.querySelector(s);
const kloktijd = s => s ? new Date(s).toLocaleTimeString("nl-NL", {hour: "2-digit", minute: "2-digit"}) : "–";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const opslag = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

// ================================================================== inloggen (OAuth 2.0 code + PKCE, zonder bibliotheek)
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const willekeurig = n => b64url(crypto.getRandomValues(new Uint8Array(n)));

async function inloggen() {
  const verifier = willekeurig(48), state = willekeurig(16);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  opslag.set("pkce", JSON.stringify({verifier, state}));
  const q = new URLSearchParams({client_id: CLIENT_ID, response_type: "code", redirect_uri: REDIRECT, scope: SCOPE,
    code_challenge: challenge, code_challenge_method: "S256", state, response_mode: "query"});
  const hint = opslag.get("login_hint"); if (hint) q.set("login_hint", hint);
  location.assign(`${AUTH}/authorize?${q}`);
}

async function tokenAanvraag(velden) {
  const r = await fetch(`${AUTH}/token`, {method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: new URLSearchParams(Object.assign({client_id: CLIENT_ID, scope: SCOPE}, velden))});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.access_token) throw new Error(j.error_description || j.error || `token ${r.status}`);
  opslag.set("tok", JSON.stringify({at: j.access_token, rt: j.refresh_token, exp: Date.now() + (j.expires_in - 120) * 1000}));
  return j.access_token;
}

async function terugVanInloggen() {          // ?code=... na de Microsoft-inlogpagina
  const q = new URLSearchParams(location.search);
  if (!q.has("code") && !q.has("error")) return;
  history.replaceState(null, "", REDIRECT);
  if (q.has("error")) throw new Error(q.get("error_description") || q.get("error"));
  const p = JSON.parse(opslag.get("pkce") || "{}"); opslag.del("pkce");
  if (!p.state || p.state !== q.get("state")) throw new Error("Inloggen niet herkend (state); probeer opnieuw.");
  await tokenAanvraag({grant_type: "authorization_code", code: q.get("code"), redirect_uri: REDIRECT, code_verifier: p.verifier});
}

async function accessToken() {
  const t = JSON.parse(opslag.get("tok") || "null");
  if (!t) return null;
  if (t.at && Date.now() < t.exp) return t.at;
  if (!t.rt) return null;
  try { return await tokenAanvraag({grant_type: "refresh_token", refresh_token: t.rt}); }
  catch (e) { opslag.del("tok"); return null; }      // verlopen (na ~24 uur): opnieuw inloggen
}

function uitloggen() { opslag.del("tok"); opslag.del("data"); location.replace(REDIRECT); }

// ================================================================== data ophalen uit OneDrive
async function haalData(token) {
  const pad = PAD.split("/").map(encodeURIComponent).join("/");
  const r = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${pad}`, {headers: {Authorization: "Bearer " + token}});
  if (r.status === 401) { opslag.del("tok"); throw Object.assign(new Error("Inloggen verlopen"), {inlog: true}); }
  if (r.status === 404) throw new Error("mobiel_v2.json niet gevonden in OneDrive (" + PAD + ").");
  if (!r.ok) throw new Error("OneDrive gaf fout " + r.status);
  const item = await r.json();
  const url = item["@microsoft.graph.downloadUrl"];
  const r2 = url ? await fetch(url) : await fetch(`https://graph.microsoft.com/v1.0/me/drive/items/${item.id}/content`, {headers: {Authorization: "Bearer " + token}});
  if (!r2.ok) throw new Error("Downloaden mislukt (" + r2.status + ")");
  const M = await r2.json();
  M._onedrive = item.lastModifiedDateTime;
  M._opgehaald = new Date().toISOString();
  opslag.set("data", JSON.stringify(M));
  return M;
}

// ================================================================== hulpjes en grafiek-bouwstenen (zelfde als Dashboard_nieuw.html)
const nl=(x,d=2)=>x.toLocaleString('nl-NL',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur=(x,d=2)=>x==null?'–':(x<0?'− ':'')+'€ '+nl(Math.abs(x),d);
const kwh=(x,d=1)=>x==null?'–':(x<0?'− ':'')+nl(Math.abs(x),d)+' kWh';
const ct=x=>x==null?'–':nl(x,1)+' ct';
const dat=s=>{const [j,m,d]=s.slice(0,10).split('-');return `${+d}-${+m}-${j}`};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS='http://www.w3.org/2000/svg';
function el(tag,attr,par){const e=document.createElementNS(NS,tag);for(const k in attr)e.setAttribute(k,attr[k]);if(par)par.appendChild(e);return e}
const $=id=>document.getElementById(id);
function verschil(a,b,f=eur,woorden=['duurder','goedkoper']){ // b - a; hoger = woorden[0]
  if(a==null||b==null)return '';const v=b-a;
  return `<span class="${v>0?'slecht':'goed'}">${f(Math.abs(v))} ${v>0?woorden[0]:woorden[1]}</span>`}

// ---------------------------------------------------------------- grafiek-bouwstenen
const swatch=s=>s.lijn?`<i class="sl" style="border-top:2px ${s.streep?'dashed':'solid'} var(${s.kleur})"></i>`
  :`<i class="sw" style="background:${s.arcering?`repeating-linear-gradient(135deg,var(${s.kleur}) 0 3px,transparent 3px 5px);border:1.5px solid var(${s.kleur})`:`var(${s.kleur})`}"></i>`;
const legenda=(id,series)=>{$(id).innerHTML=series.map(s=>`<span>${swatch(s)}${s.naam}</span>`).join('')};
const tipRij=(s,txt)=>`<div class="r"><span>${s?swatch(s):''}${s?s.naam:''}</span><span>${txt}</span></div>`;
const tekenaars=[];
function stapVan(vals){const v=vals.filter(x=>x!=null),r=Math.max(0,...v)-Math.min(0,...v),ruw=r/5;
  return [0.25,0.5,1,2,2.5,5,10,20,25,50,100,200,250,500].find(s=>s>=ruw)||1000}
function bereik(vals,stap){const v=vals.filter(x=>x!=null);return [Math.floor(Math.min(0,...v)/stap)*stap,Math.ceil(Math.max(0,...v)/stap)*stap]}
function kader(box,label,H0){
  box.querySelectorAll('svg').forEach(s=>s.remove());
  const W=Math.max(box.clientWidth,300),H=W<600?Math.round(H0*0.8):H0;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':label});box.insertBefore(svg,box.querySelector('.tip'));return [svg,W,H]}
function asSchaal(svg,W,lo,hi,stap,y,L,R,fmt){
  for(let v=lo;v<=hi+1e-9;v+=stap){el('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:css(v===0?'--axis':'--grid'),'stroke-width':v===0?1.5:1},svg);
    const t=el('text',{x:L-6,y:y(v)+4,'text-anchor':'end'},svg);t.textContent=fmt(v)}}
function plaatsTip(box,tip,ev,html){
  tip.innerHTML=html;tip.style.display='block';
  const b=box.getBoundingClientRect();let lx=ev.clientX-b.left+14;if(lx+tip.offsetWidth>b.width)lx=ev.clientX-b.left-tip.offsetWidth-14;
  tip.style.left=Math.max(0,lx)+'px';tip.style.top=Math.max(0,ev.clientY-b.top-tip.offsetHeight/2)+'px'}
// staafgrafiek: cfg {box,cats,series[{naam,kleur,arcering,vals,licht[]}],stap,fmtAs,tipHtml(i),gekozen(),klik(i),hoogte,label}
function staven(cfg){
  const box=$(cfg.box),tip=box.querySelector('.tip');
  const teken=()=>{if(!cfg.cats.length)return;
    const [svg,W,H]=kader(box,cfg.label,cfg.hoogte||300),L=50,R=8,TP=10,B=24,n=cfg.cats.length;
    const stap=cfg.stap||stapVan(cfg.series.flatMap(s=>s.vals)),[lo,hi]=bereik(cfg.series.flatMap(s=>s.vals),stap),y=v=>TP+(hi-v)/(hi-lo)*(H-TP-B),gw=(W-L-R)/n;
    const defs=el('defs',{},svg);
    cfg.series.filter(s=>s.arcering).forEach(s=>{const p=el('pattern',{id:cfg.box+'-arc',width:5,height:5,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs);
      el('rect',{width:2.5,height:5,fill:css(s.kleur)},p)});
    asSchaal(svg,W,lo,hi,stap,y,L,R,cfg.fmtAs);
    const ns=cfg.series.length,bw=Math.min(16,(gw-10)/ns),gek=cfg.gekozen?cfg.gekozen():null;
    cfg.cats.forEach((c,i)=>{
      const cx=L+gw*i+gw/2;
      if(i===gek)el('rect',{x:L+gw*i+1,y:TP,width:gw-2,height:H-TP-B,fill:css('--hover'),rx:6},svg);

      R.forEach((x, i) => {
        if (!prCfg.V) el('rect', {x: L + i * bw + 0.2, y: Math.min(y(x.p), y(0)), width: Math.max(bw - 0.4, 0.8), height: Math.abs(y(0) - y(x.p)), fill: css(KL[x.b] || '--s25')}, svg);
        if (x.t.endsWith(':00') && +x.t.slice(0, 2) % 6 === 0) { const tt = el('text', {x: L + i * bw, y: H - 5, 'text-anchor': 'middle'}, svg); tt.textContent = x.t.slice(0, 2) + 'u'; }
        if (x.nu) el('line', {x1: L + i * bw, x2: L + i * bw, y1: TP - 3, y2: H - Bm, stroke: css('--ink'), 'stroke-width': 1.5}, svg);
        const hit = el('rect', {x: L + i * bw, y: 0, width: bw, height: H, fill: 'transparent'}, svg);
        hit.addEventListener('mousemove', ev => plaatsTip(box, tip, ev, prCfg.V ? `<b>${x.t} · verwachting</b>${tipRij(null, 'p50 ' + c1(x.p50))}<div class="r muted"><span>p10 – p90</span><span>${c1(x.p10)} – ${c1(x.p90)}</span></div>` : `<b>${x.t}</b>${tipRij(null, c1(x.p) + ' · ' + x.b)}`));
        hit.addEventListener('mouseleave', () => tip.style.display = 'none');
      });
    }
    tekenaars.push(t);
  })();
  const kw = v => v == null ? '–' : nl(v, 1);
  const DEL = {totaal: [['afname', 'van net'], ['van_zb', 'van zon + batterij']], terug: [['zon_net', 'zon'], ['bat_net', 'batterij']], zon: [['zon_huis', 'huis'], ['zon_bat', 'batterij'], ['zon_naar_net', 'net']]};
  const tot = (S, k) => !S ? null : k === 'netto' ? S.afname - S.terug : S[k];
  function rij(s, naam, k, onder) {
    const W = s.stroom_w, V = s.stroom_v, f = k === 'kosten' ? eur : (v => v == null ? '–' : nl(v, 1) + ' kWh');
    const del = S => k in DEL && S ? `<div class="del">${DEL[k].map(([c, n]) => `${n} ${kw(S[c])}`).join(' · ')}${dag === 2 || !W ? ' (verwacht)' : ''}</div>` : '';
    let r;
    if (dag === 2 || !W) r = `<span><b>${f(tot(V, k))}</b> <span class="muted">verwacht</span></span>`;
    else r = `<span><b>${f(tot(W, k))}</b>${V ? ` <span class="muted">/ ${f(tot(V, k))}${dag === 1 ? ' hele dag' : ''}</span>` : ''}</span>`;
    return `<div class="rij2"><div class="rij"><span>${naam}<small>${onder}</small></span>${r}</div>${del(dag === 2 || !W ? V : W)}</div>`;
  }
  function tekenDag() {
    $('seg').querySelectorAll('button').forEach(b => b.classList.toggle('akt', +b.dataset.i === dag));
    const s = X.dagen[dag], W = s.stroom_w;
    $('dagcijfers').innerHTML = rij(s, 'Afname totaal', 'totaal', 'huis + batterij laden') + rij(s, 'Teruglevering', 'terug', 'aan het net') + rij(s, 'Zon', 'zon', 'productie')
      + rij(s, 'Netto', 'netto', 'afname − terug') + rij(s, 'Kosten', 'kosten', 'stroom incl. btw en EB')
      + `<div class="muted" style="margin-top:6px">${dag === 2 ? 'Verwachting van dagadvies' + (s.band ? ` · somber–zonnig: netto ${kw(s.band.netto[1])} – ${kw(s.band.netto[0])} kWh, kosten ${eur(s.band.kosten[1])} – ${eur(s.band.kosten[0])}` : '')
        : (dag === 1 && W ? `vet = gemeten t/m ${W.uren} uur · grijs = verwacht` : 'vet = gemeten · grijs = verwacht')}</div>`;
    const U = X.uren.filter(u => u.h.startsWith(s.datum)), ni = U.findIndex(u => u.h === X.nu_uur);
    [cz, cn, ck, cs].forEach(c => { c.U = U; c.ni = ni; });
    const pd = dag ? P.dagen[dag - 1] : null;
    $('prijskaart').hidden = !pd || !(pd.bekend || pd.verw || dag === 2);
    prCfg.R = []; prCfg.V = null;
    if (pd && pd.bekend) { prCfg.R = pd.kw; $('prijsx').textContent = `gemiddeld ${c1(pd.gem)} · laagste ${pd.min.t} · hoogste ${pd.max.t}`; }
    else if (pd && pd.verw) { prCfg.V = pd.verw; $('prijsx').textContent = `Nog niet bekend (rond 13:00). Verwachting jeroen.nl: gemiddeld ${c1(pd.verw.gem)}; lijn p50, band p10–p90.`; }
    else if (dag === 2) $('prijsx').textContent = 'Prijzen voor morgen komen rond 13:00.';
    $('leg-pr').innerHTML = prCfg.V ? `<span><i class="sl" style="border-top:2px dashed var(--verw)"></i>verwachting p50</span><span><i class="sw" style="background:var(--verw);opacity:.3"></i>p10 – p90</span><span class="muted">ct/kWh incl. btw en EB</span>`
      : ['laag', 'regulier', 'hoog'].map(b => `<span><i class="sw" style="background:var(${KL[b]})"></i>${b}</span>`).join('') + `<span class="muted">ct/kWh incl. btw en EB</span>`;
    tekenaars.forEach(f => f());
  }
  tekenDag();
}

// ------------------------------------------------------------------ tabblad Maand
function toonMaand(M) {
  const F = M.factuur, pad2 = m => String(m).padStart(2, '0');
  const lop = F.maanden.find(x => x.stand) || F.maanden.find(x => `${x.j1}-${pad2(x.m)}` === F.lopend);
  const s = lop && lop.stand, v = lop && lop.verw;
  const [jj, mm] = F.lopend.split('-').map(Number), dim = new Date(jj, mm, 0).getDate();
  if (s) {
    let h = `<div class="l">Kosten ${lop.naam} t/m ${dat(s.tot_dag).slice(0, -5)}</div><div class="groot">${eur(s.totaal)}</div>`;
    if (v) {
      const pct = Math.max(0, Math.min(100, s.totaal / v.totaal * 100)), tijdp = s.dagen / dim * 100, op = pct <= tijdp + 5;
      h += `<div class="balk"><i style="width:${pct}%"></i><b style="left:${tijdp}%"></b></div>
        <div class="x">${nl(pct, 0)}% van de verwachte factuur (${eur(v.totaal)}) na ${s.dagen} van ${dim} dagen · <span class="${op ? 'goed' : 'slecht'}">${op ? 'op koers' : 'boven verwachting'}</span></div>`;
    } else h += `<div class="x">incl. vaste kosten naar rato · nog geen verwachting voor deze maand vastgelegd</div>`;
    $('m-hero').innerHTML = h;
  } else $('m-hero').innerHTML = `<div class="l">Kosten deze maand</div><div class="x">Nog geen hele dag gemeten.</div>`;
  const VL = M.verbruik_lopend;
  let r = '';
  if (v) r += `<div class="rij"><span>Verwacht ${lop.naam} ${lop.j1}</span><b>${eur(v.totaal)}</b></div>`;
  if (lop && lop.vorig) r += `<div class="rij"><span>${lop.naam} ${lop.j0} (factuur)</span><b>${eur(lop.vorig.totaal)}</b></div>`;
  if (v && lop.vorig) r += `<div class="rij"><span>Verschil</span><b>${verschil(lop.vorig.totaal, v.totaal)}</b></div>`;
  if (v && lop.vorig) r += `<div class="rij"><span>Netto afname hele maand</span><b>${nl(v.afname_kwh - v.terug_kwh, 0)} kWh <span class="muted">/ ${nl(lop.vorig.afname_kwh - lop.vorig.terug_kwh, 0)} vorig jaar</span></b></div>`;
  if (VL && VL.vorig_zelfde) r += `<div class="rij"><span>Netto afname t/m ${dat(VL.huidig.tot_dag).slice(0, -5)}</span><b>${nl(VL.huidig.netto_kwh, 0)} kWh <span class="muted">/ ${nl(VL.vorig_zelfde.netto_kwh, 0)} vorig jaar</span></b></div>
    <div class="rij"><span>Marktprijs gemiddeld</span><b>${c1(VL.huidig.markt_ct)} <span class="muted">/ ${c1(VL.vorig_zelfde.markt_ct)}</span></b></div>`;
  $('m-vgl').innerHTML = r || '<div class="muted">Nog geen gegevens.</div>';
  const DK = M.maand_dagen || [];
  const S = [{naam: 'werkelijk', kleur: '--s26', vals: DK.map(x => x.kosten_w)}, {naam: 'verwacht', kleur: '--verw', arcering: true, vals: DK.map(x => x.kosten_v)}];
  $('leg-mk').innerHTML = S.map(s => `<span>${swatch(s)}${s.naam}</span>`).join('');
  if (DK.length) staven({box: 'g-mk', label: 'Kosten per dag', cats: DK.map(x => String(x.dag)), series: S, hoogte: 160, fmtAs: v => '€ ' + nl(v, v % 1 ? 1 : 0),
    tipHtml: i => { const x = DK[i]; return `<b>${x.wd} ${x.dag}</b>` + tipRij(S[0], eur(x.kosten_w)) + tipRij(S[1], eur(x.kosten_v)); }});
  const bm = M.batterij.maand;
  $('m-bat').innerHTML = bm ? `<div class="rij"><span>Batterij ${bm.naam.split(' ')[0]} t/m gisteren</span><b class="${bm.voordeel < 0 ? 'slecht' : 'goed'}">${eur(bm.voordeel)}</b></div>
    <div class="rij"><span>Rendement · cycli</span><b>${bm.rendement == null ? '–' : bm.rendement + '%'} · ${nl(bm.cycli, 1)}</b></div>
    <div class="muted">+ = levert op t.o.v. geen batterij (effectief, voor slijtage)</div>` : '<div class="muted">Nog geen hele dag gemeten.</div>';
}

// ------------------------------------------------------------------ tabblad Jaar
function toonJaar(M) {
  const F = M.factuur, B = M.batterij, E = F.eb;
  $('j-titel').textContent = `Jaar ${F.label} (feb ${F.jaar} – jan ${F.jaar + 1})`;
  $('j-hero').innerHTML = F.vgl ? `<div class="l">Facturen ${F.vgl.van} t/m ${F.vgl.tm}</div><div class="groot">${eur(F.vgl.huidig)}</div>
    <div class="x">${F.vgl.huidig < 0 ? 'netto uitbetaald' : 'netto betaald'} · ${F.label_vorig}: ${eur(F.vgl.vorig)} → ${verschil(F.vgl.vorig, F.vgl.huidig)}</div>`
    : `<div class="l">Facturen jaar ${F.label}</div><div class="x">Vergelijking volgt na de eerste factuur van dit jaar.</div>`;
  const MM = F.maanden, S = [{naam: F.label_vorig, kleur: '--s25', vals: MM.map(x => x.vorig ? x.vorig.totaal : null)},
    {naam: F.label, kleur: '--s26', vals: MM.map(x => x.huidig ? x.huidig.totaal : null)},
    {naam: 'verwacht', kleur: '--verw', arcering: true, vals: MM.map(x => x.verw ? x.verw.totaal : null)}];
  $('leg-jf').innerHTML = S.map(s => `<span>${swatch(s)}${s.naam}</span>`).join('');
  staven({box: 'g-jf', label: 'Factuur per maand', cats: MM.map(x => x.naam[0]), series: S, hoogte: 190, stap: 50, fmtAs: v => (v < 0 ? '−' : '') + Math.abs(v),
    tipHtml: i => { const x = MM[i]; let h = `<b>${x.naam}</b>`; S.forEach(s => { if (s.vals[i] != null) h += tipRij(s, eur(s.vals[i])); }); return h; }});
  $('j-saldo').innerHTML = `<div class="rij"><span>Saldo nu (netto terug)</span><b>${nl(E.lopend ? E.lopend.saldo_nu : E.saldo_kwh, 0)} kWh</b></div>
    <div class="rij"><span>Verwacht eind periode</span><b>${nl(E.prognose_kwh, 0)} kWh</b></div>
    <div class="rij"><span>EB-verrekening (te betalen)</span><b>${eur(E.eur, 0)}</b></div>
    <div class="muted">${esc(E.periode)}${E.afsluitend ? ' (afsluitend)' : ''}. Saldo positief: EB valt aan de marge weg. Vanaf 2027 geen saldering.</div>`;
  const PR = B.prognose;
  if (!PR) { $('j-bat').hidden = true; $('j-batg').hidden = true; return; }
  const Y = PR.jaar;
  $('j-bat').innerHTML = `<div class="l">Batterij eerste jaar (t/m ${dat(PR.einde)})</div><div class="groot">${eur(Y.midden, 0)}</div>
    <div class="x"><b>schatting</b> ${eur(Y.laag, 0)} – ${eur(Y.hoog, 0)} · na slijtage ${eur(Y.na, 0)}<br>gemeten ${eur(Y.gemeten, 0)} + geschat ${eur(Y.geschat, 0)}</div>`;
  const PD = PR.dagen, DG = B.dagen, n0 = DG.length, alle = DG.map(x => x.datum).concat(PD.map(x => x.datum));
  const SC = [{naam: 'gemeten', kleur: '--bat', lijn: true, vals: DG.map(x => x.cum).concat(PD.map(() => null))},
    {naam: 'geschat', kleur: '--bat', lijn: true, streep: true, vals: DG.map((x, i) => i === n0 - 1 ? x.cum : null).concat(PD.map(x => x.m))}];
  const MNK = 'jfmamjjasond';
  lijnen({box: 'g-jb', label: 'Batterij opgeteld', cats: alle, series: SC, hoogte: 150, markeer: n0 - 1,
    band: {kleur: '--bat', lo: DG.map((x, i) => i === n0 - 1 ? x.cum : null).concat(PD.map(x => x.l)), hi: DG.map((x, i) => i === n0 - 1 ? x.cum : null).concat(PD.map(x => x.h))},
    label_i: i => { const d = alle[i]; return d.slice(8) === '01' && +d.slice(5, 7) % 2 === 0 ? MNK[+d.slice(5, 7) - 1] : ''; }, fmtAs: v => '€' + v,
    tipHtml: i => i < n0 ? `<b>${dat(DG[i].datum)}</b>` + tipRij(SC[0], eur(DG[i].cum)) : `<b>${dat(PD[i - n0].datum)}</b>` + tipRij(SC[1], eur(PD[i - n0].m))});
}

// ================================================================== hoofdlijn
let bezig = false, laatsteStart = 0;
async function start(handmatig) {
  if (bezig) return; bezig = true; laatsteStart = Date.now();
  const knop = q("#bVervers"); if (knop) knop.disabled = true;
  const bewaard = JSON.parse(opslag.get("data") || "null");
  try {
    if (window.__TESTDATA) { toon(Object.assign({_opgehaald: new Date().toISOString()}, window.__TESTDATA)); return; }
    if (CLIENT_ID.startsWith("VUL-")) { inlogScherm("Nog niet ingesteld: vul het Client-ID in (zie handleiding).", false); return; }
    await terugVanInloggen();
    const token = await accessToken();
    if (!token) { inlogScherm(bewaard ? "Inloggen verlopen; tik op Inloggen (meestal één tik)." : ""); return; }
    toon(await haalData(token));
  } catch (e) {
    if (e.inlog) inlogScherm("Inloggen verlopen; tik op Inloggen.");
    else if (bewaard) toon(bewaard, "Ophalen mislukt (" + e.message + "). Je ziet de laatst opgehaalde gegevens.");
    else inlogScherm(e.message);
  } finally { bezig = false; const k = q("#bVervers"); if (k) k.disabled = false; }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - laatsteStart > 60000) start();
});
setInterval(() => { if (document.visibilityState === "visible") start(); }, VERVERS_MIN * 60000);
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => tekenaars.forEach(f => f()), 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => tekenaars.forEach(f => f()));
start();
</script>
